name: campusstudy

services:
  # ---------- USERS-AUTH ----------
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-auth:
    build:
      context: ../Users_Auth/users-auth
      dockerfile: Dockerfile.dev
    container_name: users-auth
    ports:
      - "8081:8081"
    volumes:
      - ../Users_Auth/users-auth:/app
      - m2-cache:/root/.m2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_RESTART_POLL_INTERVAL=2s
      - SPRING_DEVTOOLS_RESTART_QUIET_PERIOD=1s
    depends_on:
      postgres-auth:
        condition: service_healthy

  # ---------- MATERIAS ----------
  sqlserver-materias:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-materias
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MATERIAS_DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-materias-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  materias-service:
    build:
      context: ../MateriasService/MateriasService
      dockerfile: Dockerfile.dev
    container_name: materias-service
    ports:
      - "8006:8006"
    volumes:
      - ../MateriasService/MateriasService:/app
      - /app/bin
      - /app/obj
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver-materias,1433;Database=MateriasDb;User Id=sa;Password=${MATERIAS_DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_SECRET}
    depends_on:
      sqlserver-materias:
        condition: service_healthy

  # ---------- GRUPOS ----------
  postgres-grupos:
    image: postgres:16-alpine
    container_name: postgres-grupos
    environment:
      POSTGRES_DB: ${GRUPOS_DB_NAME}
      POSTGRES_USER: ${GRUPOS_DB_USER}
      POSTGRES_PASSWORD: ${GRUPOS_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg-grupos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRUPOS_DB_USER} -d ${GRUPOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grupos-service:
    build:
      context: ../GRUPOS-campusStudy/grupos-service
      dockerfile: Dockerfile.dev
    container_name: grupos-service
    ports:
      - "8082:8082"
    volumes:
      - ../GRUPOS-campusStudy/grupos-service:/app
      - m2-cache:/root/.m2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-grupos:5432/${GRUPOS_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${GRUPOS_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${GRUPOS_DB_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      - MATERIAS_URL=http://materias-service:8006
      - TZ=America/Bogota
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_RESTART_POLL_INTERVAL=2s
      - SPRING_DEVTOOLS_RESTART_QUIET_PERIOD=1s
    depends_on:
      postgres-grupos:
        condition: service_healthy
      materias-service:
        condition: service_started

  # ---------- TAREAS ----------
  postgres-tareas:
    image: postgres:16-alpine
    container_name: postgres-tareas
    environment:
      POSTGRES_DB: ${TAREAS_DB_NAME}
      POSTGRES_USER: ${TAREAS_DB_USER}
      POSTGRES_PASSWORD: ${TAREAS_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pg-tareas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TAREAS_DB_USER} -d ${TAREAS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tareas-service:
    build:
      context: ../TareasService/TareasService
      dockerfile: Dockerfile.dev
    container_name: tareas-service
    ports:
      - "8001:8001"
    volumes:
      - ../TareasService/TareasService:/app
      - /app/bin
      - /app/obj
      - /app/.git
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-tareas;Port=5432;Database=${TAREAS_DB_NAME};Username=${TAREAS_DB_USER};Password=${TAREAS_DB_PASSWORD}
      - Jwt__Key=${JWT_SECRET}
      - Servicios__Usuarios=http://users-auth:8081
      - Servicios__Materias=http://materias-service:8006
      - Servicios__Grupos=http://grupos-service:8082
      - Servicios__Notificaciones=http://notificaciones-service:3000
      - Servicios__Estadisticas=http://estadisticas-service:8003
    depends_on:
      postgres-tareas:
        condition: service_healthy
      users-auth:
        condition: service_started
      materias-service:
        condition: service_started
      grupos-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      estadisticas-service:
        condition: service_started

  # ---------- NOTIFICACIONES ----------
  mongo-notificaciones:
    image: mongo:7
    container_name: mongo-notificaciones
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIF_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIF_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${NOTIF_DB_NAME}
    ports:
      - "27018:27017"   # 27018 en tu PC: no choca con un MongoDB instalado en Windows
    volumes:
      - mongo-notificaciones-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  notificaciones-service:
    build:
      context: ../Notification_Service
      dockerfile: Dockerfile.dev
    container_name: notificaciones-service
    ports:
      - "3000:3000"
    volumes:
      - ../Notification_Service:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://${NOTIF_DB_USER}:${NOTIF_DB_PASSWORD}@mongo-notificaciones:27017/${NOTIF_DB_NAME}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - TZ=America/Bogota
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=RecursiveDirectoryUsingDynamicPriorityPolling
    depends_on:
      mongo-notificaciones:
        condition: service_healthy

  # ---------- ESTADISTICAS ----------
  postgres-estadisticas:
    image: postgres:16-alpine
    container_name: postgres-estadisticas
    environment:
      POSTGRES_DB: ${ESTADISTICAS_DB_NAME}
      POSTGRES_USER: ${ESTADISTICAS_DB_USER}
      POSTGRES_PASSWORD: ${ESTADISTICAS_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - pg-estadisticas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ESTADISTICAS_DB_USER} -d ${ESTADISTICAS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  estadisticas-service:
    build:
      context: ../Estadisticas_CampusStudy
      dockerfile: Dockerfile.dev
    container_name: estadisticas-service
    ports:
      - "8003:8003"
    volumes:
      - ../Estadisticas_CampusStudy:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://${ESTADISTICAS_DB_USER}:${ESTADISTICAS_DB_PASSWORD}@postgres-estadisticas:5432/${ESTADISTICAS_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=America/Bogota
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      postgres-estadisticas:
        condition: service_healthy

  # ---------- API GATEWAY ----------
  api-gateway:
    build:
      context: ../Api-Gateway-CampusStudy/ms-api-integracion
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ../Api-Gateway-CampusStudy/ms-api-integracion:/app
    environment:
      - USUARIOS_URL=http://users-auth:8081
      - MATERIAS_URL=http://materias-service:8006
      - GRUPOS_URL=http://grupos-service:8082
      - TAREAS_URL=http://tareas-service:8001
      - NOTIFICACIONES_URL=http://notificaciones-service:3000
      - ESTADISTICAS_URL=http://estadisticas-service:8003
      - JWT_SECRET=${JWT_SECRET}
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - users-auth
      - materias-service
      - grupos-service
      - tareas-service
      - notificaciones-service
      - estadisticas-service

  # ---------- PRUEBAS E2E (solo con --profile tests) ----------
  tests:
    build:
      context: ../tests-campusstudy
      dockerfile: Dockerfile.dev
    container_name: tests-e2e
    profiles: ["tests"]
    volumes:
      - ../tests-campusstudy:/suite
    environment:
      - GATEWAY_URL=http://api-gateway:8000
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - api-gateway

volumes:
  pg-auth-data:
  m2-cache:
  mssql-materias-data:
  pg-grupos-data:
  pg-tareas-data:
  mongo-notificaciones-data:
  pg-estadisticas-data:
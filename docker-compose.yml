name: campusstudy

services:
  # ---------- USERS-AUTH ----------
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-auth:
    build:
      context: ../Users_Auth/users-auth
      dockerfile: Dockerfile.dev
    container_name: users-auth
    ports:
      - "8081:8081"
    volumes:
      - ../Users_Auth/users-auth:/app
      - m2-cache:/root/.m2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - APP_JWT_SECRET=${JWT_SECRET}
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_RESTART_POLL_INTERVAL=2s
      - SPRING_DEVTOOLS_RESTART_QUIET_PERIOD=1s
    depends_on:
      postgres-auth:
        condition: service_healthy

  # ---------- MATERIAS ----------
  sqlserver-materias:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-materias
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MATERIAS_DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-materias-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  materias-service:
    build:
      context: ../MateriasService/MateriasService
      dockerfile: Dockerfile.dev
    container_name: materias-service
    ports:
      - "8006:8006"
    volumes:
      - ../MateriasService/MateriasService:/app
      - /app/bin
      - /app/obj
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver-materias,1433;Database=MateriasDb;User Id=sa;Password=${MATERIAS_DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_SECRET}
    depends_on:
      sqlserver-materias:
        condition: service_healthy

  # ---------- API GATEWAY ----------
  api-gateway:
    build:
      context: ../Api-Gateway-CampusStudy/ms-api-integracion
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ../Api-Gateway-CampusStudy/ms-api-integracion:/app
    environment:
      - USUARIOS_URL=http://users-auth:8081
      - MATERIAS_URL=http://materias-service:8006
      - JWT_SECRET=${JWT_SECRET}
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - users-auth
      - materias-service

volumes:
  pg-auth-data:
  m2-cache:
  mssql-materias-data: